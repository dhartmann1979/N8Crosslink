# N8 Crosslink – Projektdaten für scripts/n8-admin.sh. Genutzt wird hier nur der Keep-Alive (setup-keepalive, keepalive);
# Berechtigungen, sudo und „Update jetzt“ macht N8 Crosslink mit install.sh (--check-perms / --fix-perms) und update.sh selbst.
N8_ID=n8crosslink
N8_NAME="N8 Crosslink"
N8_MAIN_UNIT=n8crosslink.service
APP=/opt/n8crosslink
SVC_USER=n8crosslink

n8_layout() {
    STATE_DIR="$APP/data"
    N8_DATA_DIRS=("$APP/data")
    local port
    port="$(sqlite3 "$APP/data/crosslink.db" "SELECT value FROM settings WHERE section='general' AND key='web_port'" 2>/dev/null | tr -dc 0-9 || true)"
    N8_HEALTH_URL="http://127.0.0.1:${port:-8080}/api/info"
    # Keep-Alive: Weboberfläche, und jedes eingeschaltete Netz wirklich verbunden (FRN angemeldet, DMR am Master, Zello im Kanal)
    local h="http://127.0.0.1:${port:-8080}/api/n8/health"
    N8_KA_CHECKS=("n8crosslink.service|http|$N8_HEALTH_URL|Weboberfläche"
                  "n8crosslink.service|health|$h#frn|FRN verbunden"
                  "n8crosslink.service|health|$h#dmr|DMR verbunden"
                  "n8crosslink.service|health|$h#zello|Zello verbunden"
                  "n8crosslink.service|health|$h#vocoder|Vocoder")
    N8_KA_NET_UNITS=(n8crosslink.service)
    N8_KA_FAILS=5        # die Brücke verbindet sich selbst neu (Watchdogs) – erst nach 5 Minuten eingreifen
}
n8_version() { sed -n 's/^__version__ = "\(.*\)"/\1/p' "$APP/n8crosslink/__init__.py"; }
